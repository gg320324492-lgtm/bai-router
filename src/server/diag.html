<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>B.AI 路由台 · 诊断</title>
<style>
  :root {
    --bg: #16171b; --panel: #1d1f25; --line: #2c2f39; --amber: #e8a33d;
    --err: #e05d5d; --ink: #e8e6df; --dim: #8b8e9a;
    --mono: "Cascadia Mono", Consolas, monospace; --sans: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; padding: 40px 24px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); box-shadow: 0 0 8px rgba(224,93,93,.7); }
  .sub { color: var(--dim); margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; padding: 5px 0; font-size: 13px; }
  .k { color: var(--dim); width: 130px; flex: none; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding-top: 2px; }
  .v { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .v.bad { color: #e8a7a7; }
  .btns { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button { font-family: var(--sans); cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 9px 18px; font-size: 13px; }
  button.main { background: var(--amber); color: #241a08; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.12); }
  .tip { color: var(--dim); font-size: 12px; margin-top: 18px; line-height: 1.8; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #33363f; border-radius: 99px; border: 2px solid var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>服务未能启动</h1>
  <div class="sub">界面正在等后台服务就绪——服务一恢复本页会自动跳回主界面，也可手动重试。</div>

  <div class="card">
    <div class="row"><span class="k">软件版本</span><span class="v" id="ver">…</span></div>
    <div class="row"><span class="k">Windows</span><span class="v" id="win">…</span></div>
    <div class="row"><span class="k">服务运行时</span><span class="v" id="rt">…</span></div>
    <div class="row"><span class="k">最近错误</span><span class="v bad" id="err">…</span></div>
    <div class="row"><span class="k">面板地址</span><span class="v" id="panel">…</span></div>
  </div>

  <div class="btns">
    <button class="main" id="retry">立即重试启动服务</button>
    <button id="openChild">打开崩溃日志 (server-child.log)</button>
    <button id="openDir">打开数据文件夹</button>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="row"><span class="k">最近日志</span><span class="v" id="portRpt">…</span></div>
    <pre id="logBox" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:11px;line-height:1.7;color:#a9adb8;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;margin-top:8px">加载中…</pre>
  </div>

  <div class="tip">
    常见原因：<br>
    ① <b>杀毒软件拦截</b>——Windows Defender/火绒/360 把子进程杀了，请将安装目录加入白名单后点「立即重试」<br>
    ② <b>端口被占用</b>——面板地址端口（默认 15723）被其他程序占用<br>
    ③ 若反复失败，请把「崩溃日志」和「数据文件夹里的 app.log」发给开发者，一眼定位
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
async function refresh() {
  if (!window.baiDesktop) { $("err").textContent = "(非软件环境打开，无数据)"; return; }
  const d = await window.baiDesktop.diagInfo();
  $("ver").textContent = "v" + d.version;
  $("win").textContent = d.win;
  $("rt").textContent = d.runtime;
  $("err").textContent = d.lastSpawnError || "无 spawn 错误（服务进程可能反复崩溃，见下方日志）";
  $("panel").textContent = d.panel;
  $("portRpt").textContent = (d.portReport && d.portReport.length)
    ? d.portReport.map((p) => `:${p.port} ${p.killed ? "原被 " + p.killed + " 占用→" + (p.ok ? "已回收" : "回收失败") : p.blocked ? "被外部程序占用 " + p.occupant : "占用者未知"}`).join("；")
    : "端口预检通过，15722/15723 空闲";
  const lg = d.logs || {};
  $("logBox").textContent = [lg.server && ("—— server.log ——\n" + lg.server), lg.child && ("\n—— server-child.log ——\n" + lg.child), lg.app && ("\n—— app.log ——\n" + lg.app)].filter(Boolean).join("\n") || "(暂无日志)";
  window.__d = d;
}
$("retry").onclick = async () => { $("retry").textContent = "重试中…"; const ok = await window.baiDesktop.diagRetry(); $("retry").textContent = ok ? "✔ 已启动" : "✘ 仍失败"; refresh(); };
$("openChild").onclick = () => window.baiDesktop.openLog(window.__d && window.__d.childLog);
$("openDir").onclick = () => window.baiDesktop.openLog(window.__d && window.__d.dataDir);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
